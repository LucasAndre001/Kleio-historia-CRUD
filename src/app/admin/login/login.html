<div class="fundo">
  <div class="card">
    <h1>Kleio História</h1>
    <p class="sub">Área do professor</p>
    <hr />

    <form [formGroup]="form" (ngSubmit)="entrar()">
      <label for="login">Login:</label>
      <input id="login" formControlName="login" autocomplete="username" />

      <label for="senha">Senha:</label>
      <input id="senha" type="password" formControlName="senha" autocomplete="current-password" />

      <button type="submit" [disabled]="carregando()">{{ carregando() ? 'Entrando...' : 'Entrar' }}</button>

      @if (erro()) {
        <small class="erro">Login ou senha inválidos.</small>
      }
    </form>

    <a class="esqueci">Esqueci minha senha</a>
    <small class="dica">(mock: professor / 123456)</small>
  </div>
</div>
